name: Sync GitHub issue comments to Zendesk

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: read

jobs:
  sync-comment:
    # issue_comment also fires for pull requests. Only process normal issues.
    if: ${{ !github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Find Zendesk ticket and add private note
        env:
          REPOSITORY: ${{ github.repository }}
          ZENDESK_SUBDOMAIN: ${{ secrets.ZENDESK_SUBDOMAIN }}
          ZENDESK_CLIENT_ID: ${{ secrets.ZENDESK_CLIENT_ID }}
          ZENDESK_CLIENT_SECRET: ${{ secrets.ZENDESK_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          EXTERNAL_ID="github:${REPOSITORY}#$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")"

          TOKEN_RESPONSE="$(
            curl --fail-with-body \
              --silent \
              --show-error \
              --request POST \
              "https://${ZENDESK_SUBDOMAIN}.zendesk.com/oauth/tokens" \
              --header "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "grant_type=client_credentials" \
              --data-urlencode "client_id=${ZENDESK_CLIENT_ID}" \
              --data-urlencode "client_secret=${ZENDESK_CLIENT_SECRET}" \
              --data-urlencode "scope=tickets:read tickets:write" \
              --data-urlencode "expires_in=300"
          )"

          ACCESS_TOKEN="$(
            printf '%s' "$TOKEN_RESPONSE" |
              jq --exit-status --raw-output '.access_token'
          )"

          SEARCH_RESPONSE="$(
            curl --fail-with-body \
              --silent \
              --show-error \
              --get \
              "https://${ZENDESK_SUBDOMAIN}.zendesk.com/api/v2/search.json" \
              --header "Authorization: Bearer ${ACCESS_TOKEN}" \
              --data-urlencode "query=type:ticket external_id:\"${EXTERNAL_ID}\""
          )"

          TICKET_ID="$(
            printf '%s' "$SEARCH_RESPONSE" |
              jq --exit-status --raw-output \
                --arg external_id "$EXTERNAL_ID" \
                '[.results[] | select(.external_id == $external_id)] |
                 if length == 1 then
                   .[0].id
                 elif length == 0 then
                   error("No matching Zendesk ticket was found")
                 else
                   error("Multiple Zendesk tickets have the same external_id")
                 end'
          )"

          jq \
            '{
              ticket: {
                comment: {
                  public: false,
                  body: (
                    "New GitHub issue comment\n\n" +
                    "Author: @" + .comment.user.login + "\n" +
                    "GitHub URL: " + .comment.html_url + "\n\n" +
                    (.comment.body // "(Empty comment)")
                  )
                },
                additional_tags: [
                  "github_comment_received"
                ]
              }
            }' "$GITHUB_EVENT_PATH" > zendesk-comment.json

          curl --fail-with-body \
            --silent \
            --show-error \
            --request PUT \
            "https://${ZENDESK_SUBDOMAIN}.zendesk.com/api/v2/tickets/${TICKET_ID}.json" \
            --header "Authorization: Bearer ${ACCESS_TOKEN}" \
            --header "Content-Type: application/json" \
            --data @zendesk-comment.json
